<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anglické číslovky s husou</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #a7f3d0 100%);
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 4px solid #6ee7b7;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .logo-box {
            width: 40px;
            height: 40px;
            background-color: #10b981;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .title-container h1 {
            font-size: 1.1rem;
            color: #065f46;
            font-weight: 800;
        }

        .round-counter {
            background-color: #ecfdf5;
            border: 2px solid #6ee7b7;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 800;
            color: #065f46;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card {
            background-color: #ffffff;
            border-radius: 20px;
            border: 3px solid #6ee7b7;
            padding: 16px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .svg-box {
            width: 120px;
            height: 120px;
            margin: 0 auto 8px auto;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-green { background-color: #10b981; }
        .btn-amber { background-color: #f59e0b; }
        .btn-blue { background-color: #0284c7; }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin: 6px 0 10px 0;
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 6px 0 10px 0;
        }

        .btn-opt {
            padding: 10px 6px;
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-opt.active {
            background-color: #10b981 !important;
            color: #ffffff !important;
            border-color: #059669 !important;
        }

        .display-box {
            background-color: #f0fdf4;
            border: 2px solid #bbf7d0;
            border-radius: 12px;
            padding: 14px;
            margin: 10px 0;
            font-size: 1.6rem;
            font-weight: 900;
            color: #064e3b;
        }

        .input-box {
            width: 100%;
            height: 50px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 800;
            background-color: #f8fafc;
            border: 2px solid #6ee7b7;
            border-radius: 12px;
            color: #0f172a;
            outline: none;
            margin-bottom: 10px;
        }

        .table-wrap {
            max-height: 200px;
            overflow-y: auto;
            margin: 10px 0;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            text-align: left;
        }

        th, td {
            padding: 6px 8px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #ecfdf5;
            position: sticky;
            top: 0;
        }

        .suffix {
            color: #2563eb;
            font-weight: 800;
        }

        .hidden { display: none !important; }

        footer {
            text-align: center;
            padding: 8px;
            font-size: 0.75rem;
            color: #047857;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-brand" id="btnHome">
            <div class="logo-box">🪿</div>
            <div class="title-container">
                <h1>Anglické číslovky s husou</h1>
            </div>
        </div>
        <div id="headerProgress" class="round-counter hidden">
            <span id="txtHeaderRound">1 / 5</span>
        </div>
    </header>

    <main>
        <!-- STAGE 1: NASTAVENÍ -->
        <section id="stageSetup" class="card">
            <div class="svg-box" id="boxSetupGoose"></div>

            <h2 style="color: #064e3b;">Ahoj! Jsem husa 🪿</h2>
            <p style="font-size: 0.85rem; color: #64748b;">Naučím tě anglické číslovky!</p>

            <button type="button" id="btnToggleStudy" class="btn btn-blue">📖 Chci si číslovky zopakovat</button>

            <div id="boxStudyTable" class="hidden">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Číslo</th>
                                <th>Základní</th>
                                <th>Pořadové</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>

            <div style="text-align: left; margin-top: 10px;">
                <label style="font-size: 0.75rem; font-weight: 800; color: #065f46;">TYP ÚLOHY:</label>
                <div class="stack" id="groupTask">
                    <button type="button" class="btn-opt btn-task active" data-type="task" data-val="base">Základní číslovky (jedna ➔ one)</button>
                    <button type="button" class="btn-opt btn-task" data-type="task" data-val="ord-num">Pořadové číslem (1. ➔ 1st)</button>
                    <button type="button" class="btn-opt btn-task" data-type="task" data-val="ord-word">Pořadové slovem (první ➔ first)</button>
                </div>

                <label style="font-size: 0.75rem; font-weight: 800; color: #065f46;">ROZSAH:</label>
                <div class="grid-3" id="groupRange">
                    <button type="button" class="btn-opt btn-range active" data-type="range" data-val="21">1–21</button>
                    <button type="button" class="btn-opt btn-range" data-type="range" data-val="50">1–50</button>
                    <button type="button" class="btn-opt btn-range" data-type="range" data-val="100">1–100</button>
                </div>

                <label style="font-size: 0.75rem; font-weight: 800; color: #065f46;">POČET PŘÍKLADŮ:</label>
                <div class="grid-3" id="groupRounds">
                    <button type="button" class="btn-opt btn-rounds active" data-type="rounds" data-val="5">5</button>
                    <button type="button" class="btn-opt btn-rounds" data-type="rounds" data-val="10">10</button>
                    <button type="button" class="btn-opt btn-rounds" data-type="rounds" data-val="15">15</button>
                </div>
            </div>

            <button id="btnStart" class="btn btn-green">SPUSTIT HRU ➔</button>
        </section>

        <!-- STAGE 2: HRA -->
        <section id="stageGame" class="card hidden">
            <p style="font-size: 0.85rem; font-weight: 800; color: #047857;">NAPIŠ ANGLICKY:</p>

            <div class="display-box" id="txtQuestion">...</div>

            <div id="boxInputs">
                <input type="text" id="inputAnswer" class="input-box" placeholder="Odpověď..." autocomplete="off">
                <button id="btnSubmit" class="btn btn-green">ZKONTROLOVAT</button>
            </div>

            <div id="panelFeedback" class="hidden">
                <div id="boxFeedbackSvg" class="svg-box"></div>
                <h3 id="txtFeedbackTitle" style="font-size: 1.3rem;"></h3>
                <p id="txtFeedbackDesc" style="margin: 6px 0; font-weight: 600;"></p>
                <button id="btnNext" class="btn btn-amber">DALŠÍ ÚKOL ➔</button>
            </div>
        </section>

        <!-- STAGE 3: VYHODNOCENÍ -->
        <section id="stageSummary" class="card hidden">
            <div id="boxFinalSvg" class="svg-box"></div>

            <h2 id="txtFinalTitle" style="color: #064e3b;">Skvělá práce!</h2>
            <p id="txtFinalSubtitle" style="font-size: 0.85rem; color: #64748b; margin-bottom: 10px;"></p>

            <div style="background: #ecfdf5; border: 2px solid #a7f3d0; border-radius: 12px; padding: 10px; display: flex; justify-content: space-around;">
                <div>
                    <div style="font-size: 0.7rem; font-weight: 800; color: #64748b;">SPRÁVNĚ</div>
                    <div id="txtScore" style="font-size: 1.3rem; font-weight: 900; color: #10b981;">0 / 0</div>
                </div>
                <div>
                    <div style="font-size: 0.7rem; font-weight: 800; color: #64748b;">ÚSPĚŠNOST</div>
                    <div id="txtAccuracy" style="font-size: 1.3rem; font-weight: 900; color: #0284c7;">0 %</div>
                </div>
            </div>

            <button id="btnRestart" class="btn btn-green">HRÁT ZNOVU</button>
        </section>
    </main>

    <footer>
        Anglické číslovky s husou &bull; Offline aplikace
    </footer>

    <canvas id="fxCanvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 50;"></canvas>

    <!-- JAVASCRIPT APLIKACE -->
    <script>
        // === 1. DATOVÁ VRSTVA A GENERÁTOR ČÍSLOVEK ===
        class NumberData {
            static BASE_NUMBERS = [
                { n: 1, czB: "jedna", czON: "1.", czOW: "první", enB: "one", enON: "1st", root: "fir", suf: "st" },
                { n: 2, czB: "dva", czON: "2.", czOW: "druhý", enB: "two", enON: "2nd", root: "seco", suf: "nd" },
                { n: 3, czB: "tři", czON: "3.", czOW: "třetí", enB: "three", enON: "3rd", root: "thir", suf: "d" },
                { n: 4, czB: "čtyři", czON: "4.", czOW: "čtvrtý", enB: "four", enON: "4th", root: "four", suf: "th" },
                { n: 5, czB: "pět", czON: "5.", czOW: "pátý", enB: "five", enON: "5th", root: "fif", suf: "th" },
                { n: 6, czB: "šest", czON: "6.", czOW: "šestý", enB: "six", enON: "6th", root: "six", suf: "th" },
                { n: 7, czB: "sedm", czON: "7.", czOW: "sedmý", enB: "seven", enON: "7th", root: "seven", suf: "th" },
                { n: 8, czB: "osm", czON: "8.", czOW: "osmý", enB: "eight", enON: "8th", root: "eigh", suf: "th" },
                { n: 9, czB: "devět", czON: "9.", czOW: "devátý", enB: "nine", enON: "9th", root: "nin", suf: "th" },
                { n: 10, czB: "deset", czON: "10.", czOW: "desátý", enB: "ten", enON: "10th", root: "ten", suf: "th" },
                { n: 11, czB: "jedenáct", czON: "11.", czOW: "jedenáctý", enB: "eleven", enON: "11th", root: "eleven", suf: "th" },
                { n: 12, czB: "dvanáct", czON: "12.", czOW: "dvanáctý", enB: "twelve", enON: "12th", root: "twelf", suf: "th" },
                { n: 13, czB: "třináct", czON: "13.", czOW: "třináctý", enB: "thirteen", enON: "13th", root: "thirteen", suf: "th" },
                { n: 14, czB: "čtrnáct", czON: "14.", czOW: "čtrnáctý", enB: "fourteen", enON: "14th", root: "fourteen", suf: "th" },
                { n: 15, czB: "patnáct", czON: "15.", czOW: "patnáctý", enB: "fifteen", enON: "15th", root: "fifteen", suf: "th" },
                { n: 16, czB: "šestnáct", czON: "16.", czOW: "šestnáctý", enB: "sixteen", enON: "16th", root: "sixteen", suf: "th" },
                { n: 17, czB: "sedmnáct", czON: "17.", czOW: "sedmnáctý", enB: "seventeen", enON: "17th", root: "seventeen", suf: "th" },
                { n: 18, czB: "osmnáct", czON: "18.", czOW: "osmnáctý", enB: "eighteen", enON: "18th", root: "eighteen", suf: "th" },
                { n: 19, czB: "devatenáct", czON: "19.", czOW: "devatenáctý", enB: "nineteen", enON: "19th", root: "nineteen", suf: "th" },
                { n: 20, czB: "dvacet", czON: "20.", czOW: "dvacátý", enB: "twenty", enON: "20th", root: "twentie", suf: "th" },
                { n: 21, czB: "dvacet jeden", czON: "21.", czOW: "dvacátý první", enB: "twenty-one", enON: "21st", root: "twenty-fir", suf: "st" }
            ];

            static get(n) {
                if (n <= 21) return this.BASE_NUMBERS[n - 1];

                const tensEn = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety", "one hundred"];
                const tensCz = ["", "", "dvacet", "třicet", "čtyřicet", "padesát", "šedesát", "sedmdesát", "osmdesát", "devadesát", "sto"];
                const tensCzOrd = ["", "", "dvacátý", "třicátý", "čtyřicátý", "padesátý", "šedesátý", "sedmdesátý", "osmdesátý", "devadesátý", "stý"];

                if (n === 100) {
                    return { n: 100, czB: "sto", czON: "100.", czOW: "stý", enB: "one hundred", enON: "100th", root: "one hundred", suf: "th" };
                }

                const t = Math.floor(n / 10);
                const u = n % 10;

                if (u === 0) {
                    const rootTen = tensEn[t].slice(0, -1) + "ie";
                    return {
                        n: n, czB: tensCz[t], czON: `${n}.`, czOW: tensCzOrd[t],
                        enB: tensEn[t], enON: `${n}th`, root: rootTen, suf: "th"
                    };
                } else {
                    const uItem = this.BASE_NUMBERS[u - 1];
                    return {
                        n: n, czB: `${tensCz[t]} ${uItem.czB}`, czON: `${n}.`, czOW: `${tensCzOrd[t]} ${uItem.czOW}`,
                        enB: `${tensEn[t]}-${uItem.enB}`, enON: `${n}${uItem.enON.slice(-2)}`,
                        root: `${tensEn[t]}-${uItem.root}`, suf: uItem.suf
                    };
                }
            }
        }

        // === 2. HERNÍ LOGIKA (GAME ENGINE) ===
        class GameEngine {
            constructor() {
                this.taskType = 'base';
                this.maxRange = 21;
                this.totalRounds = 5;
                this.currentRound = 1;
                this.score = 0;
                this.currentItem = null;
            }

            reset() {
                this.currentRound = 1;
                this.score = 0;
                this.currentItem = null;
            }

            nextQuestion() {
                const randNum = Math.floor(Math.random() * this.maxRange) + 1;
                this.currentItem = NumberData.get(randNum);
                return this.currentItem;
            }

            check(userAnswer) {
                const cleanAns = userAnswer.trim().toLowerCase();
                let expected = "";
                let formattedDisplay = "";

                if (this.taskType === 'base') {
                    expected = this.currentItem.enB.toLowerCase();
                    formattedDisplay = this.currentItem.enB;
                } else if (this.taskType === 'ord-num') {
                    expected = this.currentItem.enON.toLowerCase();
                    formattedDisplay = this.currentItem.enON;
                } else if (this.taskType === 'ord-word') {
                    expected = (this.currentItem.root + this.currentItem.suf).toLowerCase();
                    formattedDisplay = `${this.currentItem.root}<span class="suffix">${this.currentItem.suf}</span>`;
                }

                const isCorrect = (cleanAns === expected);
                if (isCorrect) this.score++;

                return { isCorrect, formattedDisplay };
            }

            isFinished() {
                return this.currentRound >= this.totalRounds;
            }
        }

        // === 3. SVGS A EFEKTY ===
        const SVG_GRAPHICS = {
            goose: `<svg viewBox="0 0 200 220" style="width:100%;height:100%;"><path d="M 85 160 L 80 200 L 70 205 M 80 200 L 90 205" stroke="#f97316" stroke-width="6" fill="none"/><path d="M 115 160 L 120 200 L 110 205 M 120 200 L 130 205" stroke="#f97316" stroke-width="6" fill="none"/><ellipse cx="100" cy="135" rx="45" ry="35" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/><path d="M 125 125 Q 145 70 130 45 C 120 30 100 35 95 50 Q 90 85 105 125 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/><path d="M 100 45 L 75 52 L 98 60 Z" fill="#f97316"/><circle cx="112" cy="46" r="4" fill="#0f172a"/></svg>`,
            happy: `<svg viewBox="0 0 200 220" style="width:100%;height:100%;"><path d="M 85 160 L 80 200 M 115 160 L 120 200" stroke="#f97316" stroke-width="6" fill="none"/><ellipse cx="100" cy="135" rx="45" ry="35" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/><path d="M 125 125 Q 145 70 130 45 C 120 30 100 35 95 50 Q 90 85 105 125 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/><path d="M 100 42 L 75 48 L 98 56 Z" fill="#f97316"/><text x="30" y="90" font-size="30">👍</text></svg>`,
            sad: `<svg viewBox="0 0 200 220" style="width:100%;height:100%;"><path d="M 85 160 L 80 200 M 115 160 L 120 200" stroke="#f97316" stroke-width="6" fill="none"/><ellipse cx="100" cy="140" rx="45" ry="35" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/><path d="M 125 130 Q 150 90 120 65 C 105 55 90 65 90 75 Q 95 100 105 130 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/><path d="M 95 72 L 70 82 L 95 88 Z" fill="#f97316"/><text x="130" y="100" font-size="30">👎</text></svg>`
        };

        function launchConfetti() {
            const canvas = document.getElementById('fxCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            let particles = [];
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: canvas.width / 2, y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.7) * 12,
                    s: Math.random() * 6 + 4, c: ['#10b981', '#f59e0b', '#3b82f6'][Math.floor(Math.random() * 3)], l: 80
                });
            }
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;
                particles.forEach(p => {
                    if (p.l > 0) {
                        alive = true; p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.l--;
                        ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s);
                    }
                });
                if (alive) requestAnimationFrame(draw);
            }
            draw();
        }

        // === 4. UI ŘÍZENÍ A APLIKAČNÍ LOGIKA ===
        class AppUI {
            constructor() {
                this.game = new GameEngine();
                this.initDOM();
                this.bindEvents();
                this.renderStudyTable();
            }

            initDOM() {
                this.dom = {
                    setupStage: document.getElementById('stageSetup'),
                    gameStage: document.getElementById('stageGame'),
                    summaryStage: document.getElementById('stageSummary'),
                    headerProgress: document.getElementById('headerProgress'),
                    txtHeaderRound: document.getElementById('txtHeaderRound'),
                    boxSetupGoose: document.getElementById('boxSetupGoose'),
                    btnToggleStudy: document.getElementById('btnToggleStudy'),
                    boxStudyTable: document.getElementById('boxStudyTable'),
                    tableBody: document.getElementById('tableBody'),
                    txtQuestion: document.getElementById('txtQuestion'),
                    inputAnswer: document.getElementById('inputAnswer'),
                    boxInputs: document.getElementById('boxInputs'),
                    panelFeedback: document.getElementById('panelFeedback'),
                    boxFeedbackSvg: document.getElementById('boxFeedbackSvg'),
                    txtFeedbackTitle: document.getElementById('txtFeedbackTitle'),
                    txtFeedbackDesc: document.getElementById('txtFeedbackDesc'),
                    boxFinalSvg: document.getElementById('boxFinalSvg'),
                    txtFinalTitle: document.getElementById('txtFinalTitle'),
                    txtFinalSubtitle: document.getElementById('txtFinalSubtitle'),
                    txtScore: document.getElementById('txtScore'),
                    txtAccuracy: document.getElementById('txtAccuracy'),
                    btnStart: document.getElementById('btnStart'),
                    btnSubmit: document.getElementById('btnSubmit'),
                    btnNext: document.getElementById('btnNext'),
                    btnRestart: document.getElementById('btnRestart'),
                    btnHome: document.getElementById('btnHome')
                };

                this.dom.boxSetupGoose.innerHTML = SVG_GRAPHICS.goose;
            }

            bindEvents() {
                // Přepínání voleb (Task, Range, Rounds)
                document.querySelectorAll('.btn-opt').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const type = e.target.getAttribute('data-type');
                        const val = e.target.getAttribute('data-val');

                        // Vizuální aktivace ve své skupině
                        e.target.parentElement.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');

                        // Uložení nastavení
                        if (type === 'task') this.game.taskType = val;
                        if (type === 'range') this.game.maxRange = parseInt(val);
                        if (type === 'rounds') this.game.totalRounds = parseInt(val);
                    });
                });

                // Zobrazení / Skrytí tabulky
                this.dom.btnToggleStudy.onclick = () => {
                    this.dom.boxStudyTable.classList.toggle('hidden');
                };

                // Tlačítka pro postup hrou
                this.dom.btnStart.onclick = () => this.startGame();
                this.dom.btnSubmit.onclick = () => this.handleCheck();
                this.dom.btnNext.onclick = () => this.handleNext();
                this.dom.btnRestart.onclick = () => this.showSetup();
                this.dom.btnHome.onclick = () => this.showSetup();

                // Odpověď klávesou Enter
                this.dom.inputAnswer.onkeyup = (e) => {
                    if (e.key === 'Enter') this.handleCheck();
                };
            }

            renderStudyTable() {
                let html = '';
                for (let i = 1; i <= 21; i++) {
                    const item = NumberData.get(i);
                    html += `<tr><td><b>${item.n}</b></td><td>${item.enB}</td><td>${item.root}<span class="suffix">${item.suf}</span></td></tr>`;
                }
                this.dom.tableBody.innerHTML = html;
            }

            showSetup() {
                this.dom.gameStage.classList.add('hidden');
                this.dom.summaryStage.classList.add('hidden');
                this.dom.headerProgress.classList.add('hidden');
                this.dom.setupStage.classList.remove('hidden');
            }

            startGame() {
                this.game.reset();
                this.dom.setupStage.classList.add('hidden');
                this.dom.summaryStage.classList.add('hidden');
                this.dom.gameStage.classList.remove('hidden');
                this.dom.headerProgress.classList.remove('hidden');
                this.renderQuestion();
            }

            renderQuestion() {
                this.dom.txtHeaderRound.textContent = `${this.game.currentRound} / ${this.game.totalRounds}`;
                this.dom.boxInputs.classList.remove('hidden');
                this.dom.panelFeedback.classList.add('hidden');
                this.dom.inputAnswer.value = '';

                const item = this.game.nextQuestion();
                if (this.game.taskType === 'base') this.dom.txtQuestion.textContent = item.czB;
                if (this.game.taskType === 'ord-num') this.dom.txtQuestion.textContent = item.czON;
                if (this.game.taskType === 'ord-word') this.dom.txtQuestion.textContent = item.czOW;

                this.dom.inputAnswer.focus();
            }

            handleCheck() {
                const answer = this.dom.inputAnswer.value;
                if (!answer.trim()) return;

                const result = this.game.check(answer);

                this.dom.boxInputs.classList.add('hidden');
                this.dom.panelFeedback.classList.remove('hidden');

                if (result.isCorrect) {
                    this.dom.boxFeedbackSvg.innerHTML = SVG_GRAPHICS.happy;
                    this.dom.txtFeedbackTitle.textContent = "Správně! 👍";
                    this.dom.txtFeedbackTitle.style.color = "#10b981";
                    this.dom.txtFeedbackDesc.innerHTML = `Odpověď: <b>${result.formattedDisplay}</b>`;
                    launchConfetti();
                } else {
                    this.dom.boxFeedbackSvg.innerHTML = SVG_GRAPHICS.sad;
                    this.dom.txtFeedbackTitle.textContent = "Aha, vedle! 👎";
                    this.dom.txtFeedbackTitle.style.color = "#ef4444";
                    this.dom.txtFeedbackDesc.innerHTML = `Správně mělo být: <b>${result.formattedDisplay}</b>`;
                }
            }

            handleNext() {
                if (this.game.isFinished()) {
                    this.showSummary();
                } else {
                    this.game.currentRound++;
                    this.renderQuestion();
                }
            }

            showSummary() {
                this.dom.gameStage.classList.add('hidden');
                this.dom.headerProgress.classList.add('hidden');
                this.dom.summaryStage.classList.remove('hidden');

                const acc = Math.round((this.game.score / this.game.totalRounds) * 100);
                this.dom.txtScore.textContent = `${this.game.score} / ${this.game.totalRounds}`;
                this.dom.txtAccuracy.textContent = `${acc} %`;

                if (acc >= 70) {
                    this.dom.boxFinalSvg.innerHTML = SVG_GRAPHICS.happy;
                    this.dom.txtFinalTitle.textContent = "Výborně! Husa má radost! 🪿💃";
                    this.dom.txtFinalSubtitle.textContent = "Zvládl(a) jsi to skvěle!";
                    launchConfetti();
                } else {
                    this.dom.boxFinalSvg.innerHTML = SVG_GRAPHICS.sad;
                    this.dom.txtFinalTitle.textContent = "Pěkný pokus! 👍";
                    this.dom.txtFinalSubtitle.textContent = "Procvičuj dále a příště to bude super!";
                }
            }
        }

        // Spuštění aplikace po načtení dokumentu
        window.addEventListener('DOMContentLoaded', () => {
            new AppUI();
        });
    </script>
</body>
</html>
