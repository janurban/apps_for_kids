<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Matematika s koalou</title>
    
    <!-- PWA / Web App Manifest & iOS meta -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#10b981">

    <style>
        /* === RESET & OFFLINE STYLES === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 35%, #a7f3d0 100%);
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Layout Containers */
        header {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 4px solid #6ee7b7;
            position: sticky;
            top: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .logo-box {
            width: 42px;
            height: 42px;
            background-color: #10b981;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .title-container h1 {
            font-size: 1.25rem;
            color: #065f46;
            line-height: 1.1;
            font-weight: 800;
        }

        .title-container p {
            font-size: 0.75rem;
            color: #047857;
            font-weight: 600;
        }

        .round-counter {
            background-color: #ecfdf5;
            border: 2px solid #6ee7b7;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 800;
            color: #065f46;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 100%;
            background-color: #ffffff;
            border-radius: 24px;
            border: 4px solid #6ee7b7;
            padding: 20px;
            box-shadow: 0 12px 25px -5px rgba(6, 95, 70, 0.15);
            text-align: center;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Animations */
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        @keyframes wiggle {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* KOALA DANCE ANIMATION FOR END SCREEN */
        @keyframes koalaDance {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            15% { transform: translateY(-18px) rotate(-12deg) scale(1.05); }
            30% { transform: translateY(0) rotate(12deg) scale(1); }
            45% { transform: translateY(-15px) rotate(-10deg) scale(1.05); }
            60% { transform: translateY(0) rotate(10deg) scale(1); }
            75% { transform: translateY(-8px) rotate(-5deg) scale(1.02); }
            100% { transform: translateY(0) rotate(0deg) scale(1); }
        }

        .animate-dance {
            animation: koalaDance 1.1s ease-in-out infinite;
            transform-origin: center bottom;
        }

        .animate-float {
            animation: floatSlow 3s ease-in-out infinite;
        }

        .animate-wiggle {
            animation: wiggle 0.4s ease-in-out;
        }

        /* Buttons & Controls */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: 900;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 5px 0px rgba(0, 0, 0, 0.2);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0px rgba(0, 0, 0, 0.2);
        }

        .btn-green { background-color: #10b981; }
        .btn-amber { background-color: #f59e0b; }

        .round-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 8px 0 16px 0;
        }

        .difficulty-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 8px 0 16px 0;
        }

        .btn-option {
            padding: 12px 8px;
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            color: #334155;
            cursor: pointer;
            text-align: center;
        }

        .btn-option-diff {
            padding: 12px;
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 800;
            color: #334155;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-option.active, .btn-option-diff.active {
            background: #10b981;
            color: #ffffff;
            border-color: #059669;
        }

        /* Inputs */
        .math-display {
            background-color: #f0fdf4;
            border: 3px solid #bbf7d0;
            border-radius: 16px;
            padding: 16px;
            margin: 16px 0;
            font-size: 2rem;
            font-weight: 900;
            color: #064e3b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 16px 0;
        }

        .input-box {
            width: 80px;
            height: 60px;
            text-align: center;
            font-size: 1.8rem;
            font-weight: 900;
            background-color: #f8fafc;
            border: 3px solid #6ee7b7;
            border-radius: 12px;
            color: #0f172a;
            outline: none;
            user-select: text;
        }

        .input-box:focus {
            background-color: #ffffff;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        .input-label {
            font-size: 0.75rem;
            font-weight: 800;
            color: #047857;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Feedback Screen */
        .feedback-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .feedback-svg {
            width: 170px;
            height: 180px;
        }

        .hidden { display: none !important; }

        footer {
            text-align: center;
            padding: 8px;
            font-size: 0.75rem;
            color: #047857;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->

                    <circle cx="128" cy="84" r="6" fill="#1e293b" />

            <h2 style="color: #064e3b; margin-bottom: 6px;">Ahoj! Jsem koala 🐨</h2>

                    <button type="button" data-diff="1" class="btn-option-diff active">

                    </button>
                    <button type="button" data-diff="2" class="btn-option-diff">
                        <span>Největší dělitel (mimo číslo samotné)</span>
                    </button>
                    <button type="button" data-diff="3" class="btn-option-diff">
                        <span>Dělení se zbytkem (hledání podílu a zbytku)</span>

            </div>

            <!-- VYBER POČTU PŘÍKLADŮ -->

                    <button type="button" data-rounds="15" class="btn-option">15</button>
                </div>
            </div>

            <button id="btnStartGame" class="btn btn-green">
                <span>SPUSTIT HRU</span>
            </button>
        </section>

        <!-- STAGE 2: GAMEPLAY SCREEN -->
        <section id="stageGame" class="card hidden">
            
            <p id="txtTaskInstruction" style="font-size: 0.85rem; font-weight: 800; color: #047857; margin-bottom: 4px;"></p>

            <div class="math-display" id="boxMathDisplay"></div>

            <div id="boxQuestionInputs">
                <!-- TYP 1 A 2 INPUT -->
                <div id="inputsSingle" class="input-group">
                    <div style="display: flex; flex-direction: column; align-items: center;">
                        <input type="number" pattern="[0-9]*" inputmode="numeric" id="inputSingleAnswer" class="input-box" placeholder="?">
                        <span class="input-label" id="lblSingleInput">Výsledek</span>
                    </div>
                </div>

                <!-- TYP 3 INPUTS (Dělení se zbytkem) -->
                <div id="inputsDiff3" class="input-group hidden">
                    <div style="display: flex; flex-direction: column; align-items: center;">
                        <input type="number" pattern="[0-9]*" inputmode="numeric" id="inputQuotient" class="input-box" placeholder="?">
                        <span class="input-label">Podíl</span>
                    </div>

                    <span style="font-size: 1.5rem; font-weight: 800; color: #475569;">(zb.</span>

                    <div style="display: flex; flex-direction: column; align-items: center;">
                        <input type="number" pattern="[0-9]*" inputmode="numeric" id="inputRemainder" class="input-box" placeholder="0">
                        <span class="input-label">Zbytek</span>
                    </div>

                    <span style="font-size: 1.5rem; font-weight: 800; color: #475569;">)</span>
                </div>

                <button id="btnSubmitAnswer" class="btn btn-green">
                    <span>ZKONTROLOVAT</span>

            </div>

                </div>
                <button id="btnNextRound" class="btn btn-amber">
                    <span>DALŠÍ PŘÍKLAD ➔</span>
                </button>
            </div>

        </section>

        <!-- STAGE 3: SUMMARY SCREEN -->
        <section id="stageSummary" class="card hidden">
            <div id="boxFinalKoalaGraphic" style="width: 170px; height: 180px; margin: 0 auto;"></div>

            </div>

            <button id="btnPlayAgain" class="btn btn-green">
                <span>HRÁT ZNOVU</span>

        </section>

    </main>

    <footer>
        Matematika s koalou &bull; Offline aplikace pro telefony
    </footer>

        // HELPER MATH FUNCTIONS
        function gcd(a, b) {
            return b === 0 ? a : gcd(b, a % b);
        }

                    <ellipse cx="140" cy="195" rx="16" ry="14" fill="#94a3b8" transform="rotate(15 140 195)" />
                    <ellipse cx="45" cy="100" rx="12" ry="24" fill="#94a3b8" transform="rotate(-40 45 100)" />
                    <ellipse cx="155" cy="100" rx="12" ry="24" fill="#94a3b8" transform="rotate(40 155 100)" />
                    <ellipse cx="100" cy="85" rx="58" ry="48" fill="#cbd5e1" />
                    <circle cx="62" cy="93" r="9" fill="#f43f5e" opacity="0.4" />
                    <circle cx="138" cy="93" r="9" fill="#f43f5e" opacity="0.4" />
                    <path d="M 64 78 Q 72 68 80 78" fill="none" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" />
                    <path d="M 120 78 Q 128 68 136 78" fill="none" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" />
                    <ellipse cx="100" cy="88" rx="14" ry="18" fill="#334155" />
                    <ellipse cx="97" cy="82" rx="4" ry="6" fill="#64748b" />
                    <path d="M 84 110 Q 100 132 116 110 Z" fill="#f43f5e" stroke="#334155" stroke-width="2.5" />
                </svg>
            </div>`
        };

        // INIT & EVENT LISTENERS
        function init() {
            document.querySelectorAll('.btn-option-diff').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.btn-option-diff').forEach(b => b.classList.remove('active'));
                    const target = e.currentTarget;
                    target.classList.add('active');
                    state.taskType = parseInt(target.getAttribute('data-diff'));
                });
            });

            document.querySelectorAll('.btn-option').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.btn-option').forEach(b => b.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    state.totalRounds = parseInt(e.currentTarget.getAttribute('data-rounds'));
                });
            });

            dom.btnStartGame.addEventListener('click', startGame);
            dom.btnSubmitAnswer.addEventListener('click', checkAnswer);
            dom.btnNextRound.addEventListener('click', nextRound);
            dom.btnPlayAgain.addEventListener('click', resetToSetup);
            dom.btnLogoHome.addEventListener('click', resetToSetup);
        }

        function startGame() {
            state.currentRound = 1;
            state.score = 0;
            dom.stageSetup.classList.add('hidden');
            dom.stageSummary.classList.add('hidden');
            dom.stageGame.classList.remove('hidden');
            dom.headerProgress.classList.remove('hidden');

            if (state.taskType === 3) {
                // Dělení se zbytkem
                dom.inputsDiff3.classList.remove('hidden');
                dom.inputsSingle.classList.add('hidden');
            } else {
                // Společný dělitel (1) nebo Největší dělitel (2)
                dom.inputsDiff3.classList.add('hidden');
                dom.inputsSingle.classList.remove('hidden');
                dom.lblSingleInput.textContent = state.taskType === 1 ? "Největší společný dělitel" : "Největší dělitel";
            }

            generateProblem();
        }

        function generateProblem() {
            state.isRoundAnswered = false;
            dom.txtHeaderRound.textContent = `${state.currentRound} / ${state.totalRounds}`;
            dom.boxQuestionInputs.classList.remove('hidden');
            dom.panelFeedback.classList.add('hidden');

            if (state.taskType === 1) {
                // Největší společný dělitel dvou čísel
                dom.txtTaskInstruction.textContent = "Najdi největšího společného dělitele:";
                
                const targetGcd = Math.floor(Math.random() * 11) + 2; 
                let mult1 = Math.floor(Math.random() * 7) + 2; 
                let mult2 = Math.floor(Math.random() * 7) + 2; 

                while (gcd(mult1, mult2) !== 1 || Math.abs(mult1 - mult2) <= 1) {
                    mult1 = Math.floor(Math.random() * 7) + 2;
                    mult2 = Math.floor(Math.random() * 7) + 2;
                }

                state.numA = targetGcd * mult1;
                state.numB = targetGcd * mult2;
                state.correctAnswer = targetGcd;

                dom.boxMathDisplay.innerHTML = `
                    <span>${state.numA}</span>
                    <span style="color: #10b981; font-size: 1.5rem;">a</span>
                    <span>${state.numB}</span>
                `;

                dom.inputSingleAnswer.value = '';

            } else if (state.taskType === 2) {
                // Největší dělitel (mimo číslo samotné)
                dom.txtTaskInstruction.textContent = "Najdi největšího dělitele (mimo číslo samotné):";
                
                let chosenNum = 0;
                let gpd = 0;

                while (gpd < 1 || gpd > 12) {
                    const targetDivisor = Math.floor(Math.random() * 12) + 1; 
                    const multiplier = Math.floor(Math.random() * 3) + 2; 
                    chosenNum = targetDivisor * multiplier;
                    gpd = getGreatestProperDivisor(chosenNum);
                }

                state.numA = chosenNum;
                state.correctAnswer = gpd;

                dom.boxMathDisplay.innerHTML = `
                    <span style="font-size: 2.5rem;">${state.numA}</span>
                `;

                dom.inputSingleAnswer.value = '';

            } else if (state.taskType === 3) {
                // Dělení se zbytkem
                dom.txtTaskInstruction.textContent = "Vypočítej podíl a zbytek:";
                state.divisor = Math.floor(Math.random() * 8) + 2; 
                state.quotient = Math.floor(Math.random() * 9) + 1; 
                state.remainder = Math.floor(Math.random() * (state.divisor - 1)) + 1;
                state.dividend = (state.divisor * state.quotient) + state.remainder;

                dom.boxMathDisplay.innerHTML = `
                    <span>${state.dividend}</span>
                    <span style="color: #10b981;">:</span>
                    <span>${state.divisor}</span>
                    <span style="color: #10b981;">=</span>
                    <span style="color: #94a3b8;">?</span>
                `;

                dom.inputQuotient.value = '';
                dom.inputRemainder.value = '';
            }
        }

        function checkAnswer() {
            if (state.isRoundAnswered) return;

            let isCorrect = false;

            if (state.taskType === 3) {
                // Kontrola pro Dělení se zbytkem
                const userQ = parseInt(dom.inputQuotient.value);
                const userR = dom.inputRemainder.value === '' ? 0 : parseInt(dom.inputRemainder.value);

                if (isNaN(userQ)) {
                    dom.inputQuotient.classList.add('animate-wiggle');
                    setTimeout(() => dom.inputQuotient.classList.remove('animate-wiggle'), 400);
                    return;
                }

                isCorrect = (userQ === state.quotient) && (userR === state.remainder);

                if (isCorrect) {
                    dom.txtFeedbackDesc.textContent = `${state.dividend} : ${state.divisor} = ${state.quotient} (zbytek ${state.remainder})`;
                } else {
                    dom.txtFeedbackDesc.innerHTML = `Správně: <b>${state.dividend} : ${state.divisor} = ${state.quotient} (zb. ${state.remainder})</b>`;
                }

            } else {
                // Kontrola pro Typ 1 a 2
                const userVal = parseInt(dom.inputSingleAnswer.value);

                if (isNaN(userVal)) {
                    dom.inputSingleAnswer.classList.add('animate-wiggle');
                    setTimeout(() => dom.inputSingleAnswer.classList.remove('animate-wiggle'), 400);
                    return;
                }

                isCorrect = (userVal === state.correctAnswer);

                if (state.taskType === 1) {
                    if (isCorrect) {
                        dom.txtFeedbackDesc.textContent = `Největší společný dělitel je ${state.correctAnswer}.`;
                    } else {
                        dom.txtFeedbackDesc.innerHTML = `Správně: Největší společný dělitel je <b>${state.correctAnswer}</b>.`;
                    }
                } else if (state.taskType === 2) {
                    if (isCorrect) {
                        dom.txtFeedbackDesc.textContent = `Největší dělitel čísla ${state.numA} je ${state.correctAnswer}.`;
                    } else {
                        dom.txtFeedbackDesc.innerHTML = `Správně: Největší dělitel čísla ${state.numA} je <b>${state.correctAnswer}</b>.`;
                    }
                }
            }

            state.isRoundAnswered = true;
            dom.boxQuestionInputs.classList.add('hidden');
            dom.panelFeedback.classList.remove('hidden');

            if (isCorrect) {
                state.score++;
                dom.boxKoalaFeedbackSvg.innerHTML = SVG_KOALAS.happyThumbsUp;
                dom.txtFeedbackTitle.textContent = "Výborně! 👍";
                dom.txtFeedbackTitle.style.color = "#10b981";
                triggerConfetti();
            } else {
                dom.boxKoalaFeedbackSvg.innerHTML = SVG_KOALAS.sadThumbsDown;
                dom.txtFeedbackTitle.textContent = "Aha, vedle! 👎";
                dom.txtFeedbackTitle.style.color = "#ef4444";
            }
        }

        function nextRound() {
            if (state.currentRound >= state.totalRounds) {
                showFinalSummary();
            } else {
                state.currentRound++;
                generateProblem();
            }
        }

        function showFinalSummary() {
            dom.stageGame.classList.add('hidden');
            dom.headerProgress.classList.add('hidden');
            dom.stageSummary.classList.remove('hidden');

            const accuracy = Math.round((state.score / state.totalRounds) * 100);
            dom.txtFinalScore.textContent = `${state.score} / ${state.totalRounds}`;
            dom.txtFinalAccuracy.textContent = `${accuracy} %`;

            if (accuracy >= 70) {
                dom.boxFinalKoalaGraphic.innerHTML = SVG_KOALAS.dancingEnd;
                dom.txtFinalTitle.textContent = "Výborně! Koala tančí! 🐨💃";
                dom.txtFinalSubtitle.textContent = "Zvládl(a) jsi to skvěle a koala pro tebe mává a tančí!";
                triggerConfetti();
            } else {
                dom.boxFinalKoalaGraphic.innerHTML = SVG_KOALAS.sadThumbsDown;
                dom.txtFinalTitle.textContent = "Pěkný pokus! 👍";
                dom.txtFinalSubtitle.textContent = "Procvičuj dále a příště ti koala určitě zatancuje!";
            }
        }

        function resetToSetup() {
            dom.stageGame.classList.add('hidden');
            dom.stageSummary.classList.add('hidden');
            dom.headerProgress.classList.add('hidden');
            dom.stageSetup.classList.remove('hidden');
        }

        /* LIGHTWEIGHT NATIVE OFFLINE CONFETTI ENGINE */
        function triggerConfetti() {
            const canvas = document.getElementById('fxCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particles = [];
            const colors = ['#10b981', '#f59e0b', '#3b82f6', '#ec4899', '#8b5cf6'];

            for (let i = 0; i < 45; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.7) * 14,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 100
                });
            }

            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    if (p.life > 0) {
                        alive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.4;
                        p.life--;
                        ctx.fillStyle = p.color;
                        ctx.fillRect(p.x, p.y, p.size, p.size);
                    }
                });

                if (alive) requestAnimationFrame(render);
            }
            render();
        }

        // REGISTER SERVICE WORKER FOR OFFLINE PWA FUNCTIONALITY
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
            `;
            const blob = new Blob([swCode], { type: 'text/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
