<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dělení s medvědem</title>
    
    <!-- PWA / Web App Manifest & iOS meta -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f59e0b">

    <style>
        /* === RESET & OFFLINE STYLES === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 35%, #bfdbfe 100%);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Responsive Layout Containers */
        header {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 4px solid #fcd34d;
            position: sticky;
            top: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .logo-box {
            width: 42px;
            height: 42px;
            background-color: #f59e0b;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .title-container h1 {
            font-size: 1.25rem;
            color: #78350f;
            line-height: 1.1;
            font-weight: 800;
        }

        .title-container p {
            font-size: 0.75rem;
            color: #b45309;
            font-weight: 600;
        }

        .round-counter {
            background-color: #fef3c7;
            border: 2px solid #fcd34d;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 800;
            color: #78350f;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 100%;
            background-color: #ffffff;
            border-radius: 24px;
            border: 4px solid #fcd34d;
            padding: 20px;
            box-shadow: 0 12px 25px -5px rgba(180, 83, 9, 0.15);
            text-align: center;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Custom Animations */
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        @keyframes wiggle {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .animate-float {
            animation: floatSlow 3s ease-in-out infinite;
        }

        .animate-wiggle {
            animation: wiggle 0.4s ease-in-out;
        }

        /* Buttons & Controls */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: 900;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 5px 0px rgba(0, 0, 0, 0.2);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0px rgba(0, 0, 0, 0.2);
        }

        .btn-green { background-color: #10b981; }
        .btn-amber { background-color: #f59e0b; }

        .round-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 12px 0;
        }

        .btn-option {
            padding: 12px 8px;
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            color: #334155;
            cursor: pointer;
        }

        .btn-option.active {
            background: #f59e0b;
            color: #ffffff;
            border-color: #d97706;
        }

        /* Inputs */
        .math-display {
            background-color: #fffbeb;
            border: 3px solid #fde68a;
            border-radius: 16px;
            padding: 16px;
            margin: 16px 0;
            font-size: 2.2rem;
            font-weight: 900;
            color: #451a03;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 16px 0;
        }

        .input-box {
            width: 75px;
            height: 60px;
            text-align: center;
            font-size: 1.8rem;
            font-weight: 900;
            background-color: #f8fafc;
            border: 3px solid #fcd34d;
            border-radius: 12px;
            color: #0f172a;
            outline: none;
            user-select: text;
        }

        .input-box:focus {
            background-color: #ffffff;
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        .input-label {
            font-size: 0.75rem;
            font-weight: 800;
            color: #b45309;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Feedback Screen */
        .feedback-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .feedback-svg {
            width: 150px;
            height: 150px;
        }

        .hidden { display: none !important; }

        footer {
            text-align: center;
            padding: 8px;
            font-size: 0.75rem;
            color: #92400e;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <div class="header-brand" id="btnLogoHome">
            <div class="logo-box">🐻</div>
            <div class="title-container">
                <h1>Dělení s medvědem</h1>
                <p>Procvičování se zbytkem</p>
            </div>
        </div>
        <div id="headerProgress" class="round-counter hidden">
            <span>Kolo: </span><span id="txtHeaderRound">1 / 5</span>
        </div>
    </header>

    <!-- Main App Container -->
    <main>

        <!-- STAGE 1: SETUP SCREEN -->
        <section id="stageSetup" class="card">
            <div class="animate-float" style="margin-bottom: 12px;">
                <svg viewBox="0 0 200 200" style="width: 120px; height: 120px;">
                    <circle cx="40" cy="45" r="28" fill="#b45309" />
                    <circle cx="40" cy="45" r="16" fill="#fde047" />
                    <circle cx="160" cy="45" r="28" fill="#b45309" />
                    <circle cx="160" cy="45" r="16" fill="#fde047" />
                    <ellipse cx="100" cy="105" rx="68" ry="58" fill="#d97706" />
                    <ellipse cx="100" cy="120" rx="38" ry="28" fill="#fef08a" />
                    <circle cx="58" cy="115" r="10" fill="#f43f5e" opacity="0.4" />
                    <circle cx="142" cy="115" r="10" fill="#f43f5e" opacity="0.4" />
                    <circle cx="70" cy="92" r="7" fill="#1e293b" />
                    <circle cx="72" cy="90" r="2.5" fill="#ffffff" />
                    <circle cx="130" cy="92" r="7" fill="#1e293b" />
                    <circle cx="132" cy="90" r="2.5" fill="#ffffff" />
                    <ellipse cx="100" cy="110" rx="14" ry="10" fill="#451a03" />
                    <path d="M 86 128 Q 100 142 114 128" fill="none" stroke="#451a03" stroke-width="4" stroke-linecap="round" />
                </svg>
            </div>

            <h2 style="color: #451a03; margin-bottom: 6px;">Ahoj kamaráde!</h2>
            <p style="font-size: 0.9rem; color: #64748b; margin-bottom: 12px;">Pojďme si procvičit dělení se zbytkem.</p>

            <div style="background: #fffbeb; padding: 12px; border-radius: 16px; border: 2px solid #fde047;">
                <label style="font-size: 0.8rem; font-weight: 800; color: #78350f;">KOLIK CHCEŠ PŘÍKLADŮ?</label>
                <div class="round-grid">
                    <button type="button" data-rounds="5" class="btn-option active">5</button>
                    <button type="button" data-rounds="10" class="btn-option">10</button>
                    <button type="button" data-rounds="15" class="btn-option">15</button>
                </div>
            </div>

            <button id="btnStartGame" class="btn btn-green">
                <span>SPUSTIT HRU</span>
            </button>
        </section>

        <!-- STAGE 2: GAMEPLAY SCREEN -->
        <section id="stageGame" class="card hidden">
            
            <div class="math-display">
                <span id="txtDividend">17</span>
                <span style="color: #d97706;">:</span>
                <span id="txtDivisor">5</span>
                <span style="color: #d97706;">=</span>
                <span style="color: #94a3b8;">?</span>
            </div>

            <div id="boxQuestionInputs">
                <p style="font-size: 0.8rem; font-weight: 800; color: #64748b; margin-bottom: 8px;">DOPLŇ PODÍL A ZBYTEK:</p>

                <div class="input-group">
                    <div style="display: flex; flex-direction: column; align-items: center;">
                        <input type="number" pattern="[0-9]*" inputmode="numeric" id="inputQuotient" class="input-box" placeholder="?">
                        <span class="input-label">Podíl</span>
                    </div>

                    <span style="font-size: 1.5rem; font-weight: 800; color: #475569;">(zb.</span>

                    <div style="display: flex; flex-direction: column; align-items: center;">
                        <input type="number" pattern="[0-9]*" inputmode="numeric" id="inputRemainder" class="input-box" placeholder="0">
                        <span class="input-label">Zbytek</span>
                    </div>

                    <span style="font-size: 1.5rem; font-weight: 800; color: #475569;">)</span>
                </div>

                <button id="btnSubmitAnswer" class="btn btn-green">
                    <span>ZKONTROLOVAT</span>
                </button>
            </div>

            <!-- FEEDBACK PANEL -->
            <div id="panelFeedback" class="hidden feedback-box">
                <div id="boxBearFeedbackSvg" class="feedback-svg"></div>
                <div>
                    <h3 id="txtFeedbackTitle" style="font-size: 1.5rem; font-weight: 900;"></h3>
                    <p id="txtFeedbackDesc" style="font-size: 1.1rem; color: #475569; margin-top: 4px;"></p>
                </div>
                <button id="btnNextRound" class="btn btn-amber">
                    <span>DALŠÍ PŘÍKLAD ➔</span>
                </button>
            </div>

        </section>

        <!-- STAGE 3: SUMMARY SCREEN -->
        <section id="stageSummary" class="card hidden">
            <div id="boxFinalBearGraphic" style="width: 140px; height: 140px; margin: 0 auto;"></div>

            <h2 id="txtFinalTitle" style="font-size: 1.6rem; color: #451a03; margin-top: 8px;">Skvělá práce!</h2>
            <p id="txtFinalSubtitle" style="font-size: 0.9rem; color: #64748b; margin-bottom: 12px;"></p>

            <div style="background: #fffbeb; border: 2px solid #fde047; border-radius: 16px; padding: 12px; display: flex; justify-content: space-around; margin-bottom: 12px;">
                <div>
                    <div style="font-size: 0.7rem; font-weight: 800; color: #64748b;">SPRÁVNĚ</div>
                    <div id="txtFinalScore" style="font-size: 1.4rem; font-weight: 900; color: #10b981;">10 / 10</div>
                </div>
                <div>
                    <div style="font-size: 0.7rem; font-weight: 800; color: #64748b;">ÚSPĚŠNOST</div>
                    <div id="txtFinalAccuracy" style="font-size: 1.4rem; font-weight: 900; color: #0284c7;">100 %</div>
                </div>
            </div>

            <button id="btnPlayAgain" class="btn btn-green">
                <span>HRÁT ZNOVU</span>
            </button>
        </section>

    </main>

    <footer>
        Dělení s medvědem &bull; Offline aplikace
    </footer>

    <!-- Canvas Pro Fireworks / Efekty bez externích knihoven -->
    <canvas id="fxCanvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 50;"></canvas>

    <script>
        // GAME STATE
        const state = {
            totalRounds: 5,
            currentRound: 1,
            score: 0,
            dividend: 17,
            divisor: 5,
            quotient: 3,
            remainder: 2,
            isRoundAnswered: false
        };

        // DOM ELEMENTS
        const dom = {
            headerProgress: document.getElementById('headerProgress'),
            txtHeaderRound: document.getElementById('txtHeaderRound'),
            btnLogoHome: document.getElementById('btnLogoHome'),
            stageSetup: document.getElementById('stageSetup'),
            stageGame: document.getElementById('stageGame'),
            stageSummary: document.getElementById('stageSummary'),
            btnStartGame: document.getElementById('btnStartGame'),
            txtDividend: document.getElementById('txtDividend'),
            txtDivisor: document.getElementById('txtDivisor'),
            boxQuestionInputs: document.getElementById('boxQuestionInputs'),
            inputQuotient: document.getElementById('inputQuotient'),
            inputRemainder: document.getElementById('inputRemainder'),
            btnSubmitAnswer: document.getElementById('btnSubmitAnswer'),
            panelFeedback: document.getElementById('panelFeedback'),
            boxBearFeedbackSvg: document.getElementById('boxBearFeedbackSvg'),
            txtFeedbackTitle: document.getElementById('txtFeedbackTitle'),
            txtFeedbackDesc: document.getElementById('txtFeedbackDesc'),
            btnNextRound: document.getElementById('btnNextRound'),
            boxFinalBearGraphic: document.getElementById('boxFinalBearGraphic'),
            txtFinalTitle: document.getElementById('txtFinalTitle'),
            txtFinalSubtitle: document.getElementById('txtFinalSubtitle'),
            txtFinalScore: document.getElementById('txtFinalScore'),
            txtFinalAccuracy: document.getElementById('txtFinalAccuracy'),
            btnPlayAgain: document.getElementById('btnPlayAgain')
        };

        // LARGE SVG VECTOR BEARS (Thumbs up / Thumbs down)
        const SVG_BEARS = {
            thumbsUp: `
            <svg viewBox="0 0 200 200" style="width:100%; height:100%;">
                <circle cx="35" cy="45" r="26" fill="#b45309" /><circle cx="35" cy="45" r="15" fill="#fde047" />
                <circle cx="165" cy="45" r="26" fill="#b45309" /><circle cx="165" cy="45" r="15" fill="#fde047" />
                <ellipse cx="100" cy="100" rx="66" ry="56" fill="#d97706" />
                <ellipse cx="100" cy="115" rx="38" ry="26" fill="#fef08a" />
                <path d="M 62 88 Q 72 74 82 88" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round" />
                <path d="M 118 88 Q 128 74 138 88" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round" />
                <ellipse cx="100" cy="106" rx="14" ry="10" fill="#451a03" />
                <path d="M 82 122 Q 100 140 118 122 Z" fill="#f43f5e" stroke="#451a03" stroke-width="3" />
                <g transform="translate(110, 70)">
                    <circle cx="36" cy="36" r="34" fill="#10b981" stroke="#ffffff" stroke-width="4" />
                    <text x="14" y="50" font-size="42">👍</text>
                </g>
            </svg>`,

            thumbsDown: `
            <svg viewBox="0 0 200 200" style="width:100%; height:100%;">
                <circle cx="38" cy="55" r="26" fill="#b45309" /><circle cx="38" cy="55" r="15" fill="#fcd34d" />
                <circle cx="162" cy="55" r="26" fill="#b45309" /><circle cx="162" cy="55" r="15" fill="#fcd34d" />
                <ellipse cx="100" cy="105" rx="66" ry="56" fill="#d97706" />
                <ellipse cx="100" cy="120" rx="38" ry="26" fill="#fef08a" />
                <circle cx="70" cy="94" r="6" fill="#1e293b" />
                <circle cx="130" cy="94" r="6" fill="#1e293b" />
                <path d="M 60 82 L 78 88" stroke="#451a03" stroke-width="3.5" stroke-linecap="round" />
                <path d="M 140 82 L 122 88" stroke="#451a03" stroke-width="3.5" stroke-linecap="round" />
                <ellipse cx="100" cy="112" rx="14" ry="10" fill="#451a03" />
                <path d="M 86 134 Q 100 122 114 134" fill="none" stroke="#451a03" stroke-width="4" stroke-linecap="round" />
                <g transform="translate(110, 80)">
                    <circle cx="36" cy="36" r="34" fill="#ef4444" stroke="#ffffff" stroke-width="4" />
                    <text x="14" y="50" font-size="42">👎</text>
                </g>
            </svg>`
        };

        // INIT & EVENT LISTENERS
        function init() {
            document.querySelectorAll('.btn-option').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.btn-option').forEach(b => b.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    state.totalRounds = parseInt(e.currentTarget.getAttribute('data-rounds'));
                });
            });

            dom.btnStartGame.addEventListener('click', startGame);
            dom.btnSubmitAnswer.addEventListener('click', checkAnswer);
            dom.btnNextRound.addEventListener('click', nextRound);
            dom.btnPlayAgain.addEventListener('click', resetToSetup);
            dom.btnLogoHome.addEventListener('click', resetToSetup);
        }

        function startGame() {
            state.currentRound = 1;
            state.score = 0;
            dom.stageSetup.classList.add('hidden');
            dom.stageSummary.classList.add('hidden');
            dom.stageGame.classList.remove('hidden');
            dom.headerProgress.classList.remove('hidden');
            generateProblem();
        }

        function generateProblem() {
            state.isRoundAnswered = false;
            state.divisor = Math.floor(Math.random() * 8) + 2; // 2 - 9
            state.quotient = Math.floor(Math.random() * 9) + 1; // 1 - 9
            state.remainder = Math.floor(Math.random() * (state.divisor - 1)) + 1;
            state.dividend = (state.divisor * state.quotient) + state.remainder;

            dom.txtHeaderRound.textContent = `${state.currentRound} / ${state.totalRounds}`;
            dom.txtDividend.textContent = state.dividend;
            dom.txtDivisor.textContent = state.divisor;

            dom.inputQuotient.value = '';
            dom.inputRemainder.value = '';
            dom.boxQuestionInputs.classList.remove('hidden');
            dom.panelFeedback.classList.add('hidden');
        }

        function checkAnswer() {
            if (state.isRoundAnswered) return;

            const userQ = parseInt(dom.inputQuotient.value);
            const userR = dom.inputRemainder.value === '' ? 0 : parseInt(dom.inputRemainder.value);

            if (isNaN(userQ)) {
                dom.inputQuotient.classList.add('animate-wiggle');
                setTimeout(() => dom.inputQuotient.classList.remove('animate-wiggle'), 400);
                return;
            }

            state.isRoundAnswered = true;
            const isCorrect = (userQ === state.quotient) && (userR === state.remainder);

            dom.boxQuestionInputs.classList.add('hidden');
            dom.panelFeedback.classList.remove('hidden');

            if (isCorrect) {
                state.score++;
                dom.boxBearFeedbackSvg.innerHTML = SVG_BEARS.thumbsUp;
                dom.txtFeedbackTitle.textContent = "Výborně! 👍";
                dom.txtFeedbackTitle.style.color = "#10b981";
                dom.txtFeedbackDesc.textContent = `${state.dividend} : ${state.divisor} = ${state.quotient} (zbytek ${state.remainder})`;
                triggerConfetti();
            } else {
                dom.boxBearFeedbackSvg.innerHTML = SVG_BEARS.thumbsDown;
                dom.txtFeedbackTitle.textContent = "Aha, vedle! 👎";
                dom.txtFeedbackTitle.style.color = "#ef4444";
                dom.txtFeedbackDesc.innerHTML = `Správně: <b>${state.dividend} : ${state.divisor} = ${state.quotient} (zb. ${state.remainder})</b>`;
            }
        }

        function nextRound() {
            if (state.currentRound >= state.totalRounds) {
                showFinalSummary();
            } else {
                state.currentRound++;
                generateProblem();
            }
        }

        function showFinalSummary() {
            dom.stageGame.classList.add('hidden');
            dom.headerProgress.classList.add('hidden');
            dom.stageSummary.classList.remove('hidden');

            const accuracy = Math.round((state.score / state.totalRounds) * 100);
            dom.txtFinalScore.textContent = `${state.score} / ${state.totalRounds}`;
            dom.txtFinalAccuracy.textContent = `${accuracy} %`;

            if (accuracy === 100) {
                dom.boxFinalBearGraphic.innerHTML = SVG_BEARS.thumbsUp;
                dom.txtFinalTitle.textContent = "Výborně! Skvělá práce! 🥳";
                dom.txtFinalSubtitle.textContent = "Všechny příklady máš úplně správně!";
                triggerConfetti();
            } else {
                dom.boxFinalBearGraphic.innerHTML = SVG_BEARS.thumbsUp;
                dom.txtFinalTitle.textContent = "Pěkný výsledek! 👏";
                dom.txtFinalSubtitle.textContent = "Procvičuj dále a za chvíli to zvládneš bez jediné chyby.";
            }
        }

        function resetToSetup() {
            dom.stageGame.classList.add('hidden');
            dom.stageSummary.classList.add('hidden');
            dom.headerProgress.classList.add('hidden');
            dom.stageSetup.classList.remove('hidden');
        }

        /* LIGHTWEIGHT NATIVE OFFLINE CONFETTI ENGINE */
        function triggerConfetti() {
            const canvas = document.getElementById('fxCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particles = [];
            const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'];

            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.7) * 14,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 100
                });
            }

            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    if (p.life > 0) {
                        alive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.4; // Gravity
                        p.life--;
                        ctx.fillStyle = p.color;
                        ctx.fillRect(p.x, p.y, p.size, p.size);
                    }
                });

                if (alive) requestAnimationFrame(render);
            }
            render();
        }

        // REGISTER SERVICE WORKER FOR OFFLINE PWA FUNCTIONALITY
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
            `;
            const blob = new Blob([swCode], { type: 'text/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
